<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/sims-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMS Raipur | Complete Preparation for a Better Tomorrow</title>
    <meta name="description" content="Prepare for competitive examinations with expert faculty, structured study material, regular test series, and personalized academic guidance at SIMS Raipur." />
    <!-- Pre-paint Theme Init (No Flash) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sims-theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-[#FFF9ED] text-[#263347] font-sans antialiased selection:bg-[#D9A52E]/30 selection:text-[#061426]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
