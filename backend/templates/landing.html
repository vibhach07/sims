<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --navy: #061426;
      --navy-card: #0c203a;
      --gold: #D9A52E;
      --gold-hover: #F0C45B;
      --slate: #94a3b8;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--navy);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--navy-card);
      border: 1px solid rgba(217, 165, 46, 0.25);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo {
      height: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 24px 0;
      text-align: left;
    }
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
    }
    .info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--slate);
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      font-family: monospace;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }
    .btn-primary:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--slate);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/img/sims-logo.png" alt="SIMS Raipur Logo" class="logo">
    <h1>SIMS Raipur API Gateway</h1>
    <div class="badge-status">
      <span class="badge-dot"></span>
      <span>API System Status: {{ status }} ({{ status_code }})</span>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">System Version</div>
        <div class="info-value">v{{ version }}</div>
      </div>
      <div class="info-box">
        <div class="info-label">Production Build</div>
        <div class="info-value">{{ build_id }}</div>
      </div>
    </div>

    <div class="actions">
      <a href="{{ admin_url }}" class="btn btn-primary">
        Control Center (Admin) &rarr;
      </a>
      <a href="{{ frontend_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
        Visit Student Portal &rarr;
      </a>
    </div>

    <div class="footer">
      &copy; 2026 SIMS Raipur. Secure Production API Cluster.
    </div>
  </div>
</body>
</html>
